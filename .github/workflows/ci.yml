name: CI

# Only changes that can alter the game or how it is built run checks and cut a release; docs and other
# repository chores (a README edit, say) do not rebuild three installers.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'public/**'
      - 'build/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'electron-builder.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'electron/**'
      - 'public/**'
      - 'build/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'electron-builder.yml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # electron-builder fetches the Electron it packages; the dev binary in node_modules is never needed in CI.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  version:
    name: Release version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # major.minor from package.json, patch = this workflow's run number, so every push to main gets its own release.
      - id: version
        run: echo "version=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: --mac dmg
          - name: Windows
            os: windows-latest
            target: --win nsis
          - name: Linux
            os: ubuntu-latest
            target: --linux AppImage
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificates yet: build unsigned instead of failing on a missing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: npm pkg set version=${{ needs.version.outputs.version }}
      - run: bun run desktop:build
      - run: bunx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage

  release:
    name: GitHub Release
    needs: [version, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: The Lighthouse ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: 'true'
          files: artifacts/*
